# Nexora Commerce — nginx example (verified with `nginx -t`).
# Replace server_name, root and the PHP-FPM socket path for your host.

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;
    return 301 https://$host$request_uri;
}

server {
    # Works on nginx 1.18–1.24 (Ubuntu/Debian LTS). On nginx >= 1.25.1 you may write "listen 443 ssl;" + "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.example.com;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;

    root /home/account/nexora-commerce/public;
    index index.php;

    server_tokens off;
    client_max_body_size 64m;      # product images, imports and update bundles
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # If the nginx Brotli module is installed, uncomment (public/build ships precompressed .br files).
    # brotli_static on;
    # brotli on;
    # brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /setup.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/setup.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known/) { deny all; }

    # Vite production build: file names carry a content hash (name-HASH.ext), so cache for a year.
    location ^~ /build/assets/ {
        try_files $uri =404;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The manifest must always be fresh: it maps entry points to the current hashed files.
    location ^~ /build/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Stable compatibility assets (not hashed) can change during an update: short cache with revalidation.
    location ~* ^/assets/.*\.(?:css|js|woff2|svg|png|jpg|jpeg|webp|avif|ico)$ {
        try_files $uri =404;
        gzip_static on;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # Uploaded media keep a stable URL when explicitly replaced.
    location ^~ /media/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }
}
