server {
    listen 443 ssl http2;
    server_name shop.example.com;

    root /home/account/nexora-commerce/public;
    index index.php;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # If the nginx Brotli module is installed, enable these two directives.
    # brotli_static on;
    # brotli on;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /setup.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/setup.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location = /upgrade.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/upgrade.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }

    # Vite production assets use content hashes, so a one-year immutable cache is safe.
    location ~* ^/assets/.+\.[a-f0-9]{8,}\.(?:css|js|woff2|svg|png|jpg|jpeg|webp|avif)$ {
        try_files $uri =404;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Stable/unhashed compatibility assets can be replaced during an update; do not mark immutable.
    location ~* ^/assets/.*\.(?:css|js|woff2|svg|png|jpg|jpeg|webp|avif)$ {
        try_files $uri =404;
        gzip_static on;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # Uploaded media may keep a stable URL when an asset is explicitly replaced.
    location ^~ /media/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }
}
