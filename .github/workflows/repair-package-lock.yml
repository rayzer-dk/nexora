name: Repair package lock
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Refresh package lock for npm audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Rebuild lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify install and audit
        run: |
          npm ci
          npm audit --omit=dev
      - name: Commit repaired lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already coherent"
            exit 0
          fi
          git commit -m "Refresh package lock for npm audit"
          git push
