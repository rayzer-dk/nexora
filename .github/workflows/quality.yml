name: Quality Gate

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run ui:icons:audit
      - run: npm run configurability:audit
      - run: npm run build:production

  browser-qa:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nexora_e2e
          MYSQL_USER: nexora
          MYSQL_PASSWORD: nexora
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: e2e-secret-0123456789abcdef0123456789abcdef
      DATABASE_URL: mysql://nexora:nexora@127.0.0.1:3306/nexora_e2e?charset=utf8mb4
      DATABASE_SERVER_VERSION: '8.4.0'
      LOCK_DSN: flock
      MAILER_DSN: null://null
      E2E_BASE_URL: http://127.0.0.1:8000
      TELEGRAM_API_BASE: http://127.0.0.1:8099
      APP_PUBLIC_URL: http://127.0.0.1:8000
      E2E_ADMIN_EMAIL: e2e-admin@example.test
      E2E_ADMIN_PASSWORD: Nexora-E2E-2026-Strong!
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype,curl,dom,fileinfo,gd,iconv,intl,mbstring,openssl,pdo,pdo_mysql,simplexml,sodium,zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm install --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build:production
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Prepare writable runtime directories
        run: |
          mkdir -p var/cache var/log var/install public/media
          chmod -R u+rwX var public/media
          rm -f var/install/installed.lock
      - name: Install Nexora E2E store
        run: >
          php bin/console commerce:install --no-interaction
          --store-name="Nexora E2E"
          --admin-name="E2E Admin"
          --admin-email="$E2E_ADMIN_EMAIL"
          --admin-password="$E2E_ADMIN_PASSWORD"
          --public-url="$E2E_BASE_URL"
          --site-mode=hybrid
          --demo
      - name: Start storefront
        run: |
          php -S 127.0.0.1:8099 tests/e2e/fixtures/telegram-mock.php > var/log/e2e-telegram.log 2>&1 &
          php -S 127.0.0.1:8000 -t public tests/e2e/router.php > var/log/e2e-web.log 2>&1 &
          echo $! > var/e2e-server.pid
          for i in {1..30}; do
            if curl --fail --silent --show-error "$E2E_BASE_URL/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat var/log/e2e-web.log
          exit 1
      - name: Build E2E extension fixture
        run: |
          rm -f var/e2e-extension.zip
          (
            cd tests/e2e/fixtures/e2e-extension
            zip -q "$GITHUB_WORKSPACE/var/e2e-extension.zip" manifest.json
          )
          unzip -t var/e2e-extension.zip
      - name: Playwright Chromium, Firefox and WebKit
        shell: bash
        run: |
          if ! npm run e2e; then
            echo '--- Nexora E2E server log (last 200 lines; the full log is in the playwright-report artifact) ---'
            tail -n 200 var/log/e2e-web.log || true
            exit 1
          fi
      - name: Audit application error logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          : > var/log/e2e-errors.log
          for file in var/log/e2e-web.log var/log/prod.log; do
            [ -f "$file" ] || continue
            if grep -E -i '\[(critical|alert|emergency|error)\]|PHP (Fatal error|Parse error|Warning)|Uncaught .*(Exception|Error)|SQLSTATE\[' "$file" \
              | grep -E -v 'Symfony\\Component\\HttpKernel\\Exception\\(NotFound|AccessDenied)HttpException:' \
              >> var/log/e2e-errors.log; then
              true
            fi
          done
          if [ -s var/log/e2e-errors.log ]; then
            echo "Runtime error audit found errors:"
            cat var/log/e2e-errors.log
            exit 1
          fi
          echo "Runtime error audit: clean"
      - name: Visual regression
        shell: bash
        run: |
          if find tests/e2e/__snapshots__ -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            npm run e2e:visual
          else
            echo 'No committed visual baseline yet; generating the canonical baseline for review.'
            npm run e2e:update
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            var/test-results/playwright/
            var/log/e2e-web.log
            var/log/e2e-errors.log
            var/log/prod.log
            tests/e2e/__snapshots__/
          if-no-files-found: ignore
          retention-days: 7
