# Forward-compatibility watch: runs the unit suite on the newest PHP branches.
# It never blocks a release (continue-on-error); a red run means "look before PHP ships".
# The `nightly` entry tracks PHP master and becomes PHP 8.6 as soon as that branch is open.
name: PHP next
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', 'nightly']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype,curl,dom,fileinfo,gd,iconv,intl,mbstring,openssl,pdo_mysql,simplexml,sodium,zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=php+
      - run: php -d error_reporting=-1 -d display_errors=1 vendor/bin/phpunit --configuration phpunit.xml.dist
      - run: php bin/twig-syntax-check.php themes/default/templates
