name: Performance and network audit

on:
  push:
    branches: [main, release/4.0.23]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Live demo performance and Workbox checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nexora_e2e
          MYSQL_USER: nexora
          MYSQL_PASSWORD: nexora
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=20

    env:
      CI: '1'
      E2E_PERFORMANCE: '1'
      E2E_STATIC_CACHE: '1'
      APP_ENV: prod
      APP_DEBUG: '0'
      DATABASE_URL: mysql://nexora:nexora@127.0.0.1:3306/nexora_e2e?charset=utf8mb4
      DATABASE_SERVER_VERSION: '8.4.0'
      LOCK_DSN: flock
      MAILER_DSN: null://null
      APP_PUBLIC_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_ADMIN_EMAIL: e2e-admin@example.test

    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype,curl,dom,fileinfo,gd,iconv,intl,mbstring,openssl,pdo,pdo_mysql,simplexml,sodium,zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Prepare isolated credentials
        shell: bash
        run: |
          echo "APP_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Install dependencies and build
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:production

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install disposable Nexora shop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/cache var/log var/install public/media
          chmod -R u+rwX var public/media
          rm -f var/install/installed.lock
          php bin/console commerce:install --no-interaction \
            --store-name="Nexora E2E" \
            --admin-name="E2E Admin" \
            --admin-email="$E2E_ADMIN_EMAIL" \
            --admin-password="$E2E_ADMIN_PASSWORD" \
            --public-url="$E2E_BASE_URL" \
            --site-mode=hybrid --demo

      - name: Start local Nexora
        shell: bash
        run: |
          php -S 127.0.0.1:8000 -t public tests/e2e/router.php > var/log/e2e-web.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent --show-error "$E2E_BASE_URL/" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat var/log/e2e-web.log
          exit 1

      - name: Measure real storefront, network throttling and cache isolation
        run: npx playwright test tests/e2e/performance-network.spec.ts tests/e2e/web-vitals.spec.ts tests/e2e/motion-performance.spec.ts tests/e2e/motion.spec.ts --project=chromium-desktop --workers=1 --retries=0

      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-performance-audit
          path: |
            playwright-report/
            var/test-results/playwright/
            var/log/e2e-web.log
            var/log/prod.log
          retention-days: 14
          if-no-files-found: warn
