name: Import production archive
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message != 'Sync production archive into repository'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Import uploaded production archive
        shell: bash
        run: |
          set -euo pipefail
          archive="Nexora_Commerce_v3.5.0_Production.zip"
          expected="5b44c08c29faf99529b3ade7c7a670497d911a11edaebbc00511f2835aa06644"

          test -f "$archive"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual" = "$expected"

          tmp="$(mktemp -d)"
          unzip -q "$archive" -d "$tmp"

          test -f "$tmp/public/index.php"
          test -f "$tmp/public/setup.php"
          test -f "$tmp/vendor/autoload_runtime.php"
          test -f "$tmp/public/build/.vite/manifest.json"
          test -f "$tmp/resources/platform/release.json"

          cp -a "$tmp"/. ./
          rm -f "$archive"

          php -l public/index.php
          php -l public/setup.php
          php -l bin/console
          php bin/release-check.php

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes after archive import."
            exit 0
          fi
          git commit -m "Sync production archive into repository"
          git push
