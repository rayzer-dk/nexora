name: Nexora Rector review (dry-run)

# Rector never writes to main: this workflow only reports proposed changes.
# Apply a suggestion by hand in main after review, PHPStan, PHPCS and PHPUnit.

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.php'
      - 'rector.php'
      - '.github/workflows/rector-autofix.yml'
  workflow_dispatch:
    inputs:
      php_file:
        description: 'Existing src/*.php file to review (empty: files changed by the last commit)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install development-only Rector
        run: composer install --working-dir=tools/quality --no-interaction --prefer-dist --no-progress
      - name: Report Rector suggestions without rewriting sources
        shell: bash
        env:
          TARGET_FILE: ${{ inputs.php_file }}
        run: |
          set -euo pipefail
          : > rector-report.txt
          if [ -n "${TARGET_FILE:-}" ]; then
            php_files=("$TARGET_FILE")
          else
            mapfile -d '' -t php_files < <(git diff --name-only -z --diff-filter=ACM HEAD^ HEAD -- src)
          fi
          for file in "${php_files[@]}"; do
            [[ "$file" =~ ^src/[A-Za-z0-9_./-]+\.php$ && "$file" != *..* && -f "$file" && ! -L "$file" ]] || continue
            php tools/quality/source_guard.php --check "$file"
            set +e
            tools/quality/vendor/bin/rector process "$file" --config=rector.php --dry-run --no-progress-bar | tee -a rector-report.txt
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then echo "Rector reported suggestions or diagnostics for $file (exit $status)."; fi
          done
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rector-dry-run-report
          path: rector-report.txt
          if-no-files-found: ignore
          retention-days: 14
