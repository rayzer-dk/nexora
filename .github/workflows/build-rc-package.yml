name: Build Nexora production package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype,curl,dom,fileinfo,gd,iconv,intl,mbstring,openssl,pdo,pdo_mysql,simplexml,sodium,zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: composer validate --strict
      - run: composer install --no-dev --prefer-dist --optimize-autoloader --classmap-authoritative --no-interaction --no-progress
      - name: Check browser installer before packaging
        run: |
          php tests/installer-render-smoke.php uk-UA
          php tests/installer-render-smoke.php ru-RU
          php tests/installer-render-smoke.php en-US
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build:production

      # Runs every release check, assembles the one-upload package, writes the manifest and the checksums.
      - name: Build the production package
        id: package
        run: |
          bash tools/package-production.sh
          version="$(php -r "require 'src/Core/Platform/PlatformVersion.php'; echo Commerce\\Core\\Platform\\PlatformVersion::VERSION;")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          (cd build && sha256sum "Nexora_Commerce_v${version}_PRODUCTION.zip" > "Nexora_Commerce_v${version}_PRODUCTION.zip.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: Nexora_Commerce_v${{ steps.package.outputs.version }}_PRODUCTION
          path: |
            build/Nexora_Commerce_v${{ steps.package.outputs.version }}_PRODUCTION.zip
            build/Nexora_Commerce_v${{ steps.package.outputs.version }}_PRODUCTION.zip.sha256
          if-no-files-found: error
          retention-days: 7
