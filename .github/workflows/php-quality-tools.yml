name: PHP quality tooling

# The single PHP quality workflow. Blocking: UTF-8 without BOM, source guard,
# PHPStan level 3, PHPCS. Advisory reports: Deptrac, strict PHPStan level 5,
# Rector dry-run. Nothing here rewrites, commits or pushes source code.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype,curl,dom,fileinfo,gd,iconv,intl,libxml,mbstring,openssl,pdo_mysql,simplexml,sodium,tokenizer,xmlwriter,zip
          coverage: none
          tools: composer:v2
      - name: Validate isolated tools manifest
        working-directory: tools/quality
        run: composer validate --no-check-publish --no-check-lock
      - name: Install isolated analysis tools (not production dependencies)
        working-directory: tools/quality
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install locked application dependencies (autoload for analysis and tests)
        id: dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: UTF-8 without BOM (whole repository)
        run: php bin/source-encoding-check.php
      - name: Encoding guard regression tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: vendor/bin/phpunit --configuration=phpunit.xml.dist tests/SourceEncodingCheckTest.php
      - name: Source guard regression fixtures
        if: ${{ !cancelled() }}
        run: php tools/quality/source_guard_test.php
      - name: Validate changed source integrity
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          php tools/quality/source_guard.php --check tools/quality/source_guard.php tools/quality/source_guard_test.php
          git diff --name-only --diff-filter=ACM HEAD^ HEAD -- src \
            | grep -E '\.(php|js|jsx|ts|tsx|twig|css|scss|xml|json|yml|yaml|html)$' > /tmp/changed-quality-files || true
          while IFS= read -r file; do
            php tools/quality/source_guard.php --check "$file"
            if [[ "$file" == *.php ]]; then php -l "$file"; fi
          done < /tmp/changed-quality-files
      - name: PHPStan (level 3, no baseline)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: tools/quality/vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress --memory-limit=2G
      - name: PHP_CodeSniffer security, naming and hygiene rules
        if: ${{ !cancelled() }}
        run: tools/quality/vendor/bin/phpcs --standard=phpcs.xml.dist --report=summary
      - name: Deptrac architectural dependency report (advisory during onboarding)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: tools/quality/vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress
      - name: Strict PHPStan level 5 report (advisory, no baseline)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        run: tools/quality/vendor/bin/phpstan analyse -c phpstan.strict.neon.dist --no-progress --memory-limit=2G
      - name: Rector suggestions (dry-run report, never applied)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: tools/quality/vendor/bin/rector process --config=rector.php --dry-run --no-progress-bar --memory-limit=2G
