framework:
    default_locale: 'uk-UA'
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: false
    session:
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true
        metadata_update_threshold: 60
        # Sessions live inside the project (var/sessions): shared hosts often have an unwritable or
        # purged system session directory, which makes every login bounce back to the form.
        save_path: '%kernel.project_dir%/var/sessions'
        gc_probability: 1
        gc_divisor: 100
        gc_maxlifetime: 14400
    php_errors:
        log: true
    trusted_proxies: '%env(default::SYMFONY_TRUSTED_PROXIES)%'
    messenger:
        default_bus: messenger.bus.default
    mailer:
        dsn: '%env(MAILER_DSN)%'
    lock: '%env(LOCK_DSN)%'
    cache:
        prefix_seed: nexora_commerce
        default_redis_provider: '%env(REDIS_DSN)%'
        default_valkey_provider: '%env(VALKEY_DSN)%'
        pools:
            cache.storefront:
                adapter: cache.app
                default_lifetime: 30
            cache.shipping:
                adapter: cache.app
                default_lifetime: 600
            cache.security:
                adapter: cache.app
                default_lifetime: 900
    rate_limiter:
        login:
            policy: fixed_window
            limit: 10
            interval: '1 minute'
        password_recovery:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        public_form:
            policy: fixed_window
            limit: 8
            interval: '1 minute'
        checkout_mutation:
            policy: fixed_window
            limit: 120
            interval: '1 minute'
