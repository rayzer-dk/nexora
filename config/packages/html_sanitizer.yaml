framework:
    html_sanitizer:
        sanitizers:
            commerce.rich_text:
                allow_safe_elements: true
                # Editor images come from the media library (/media/...) and internal links are relative.
                allow_relative_links: true
                allow_relative_medias: true
                max_input_length: 250000
                # Colour, font and line-height from the editor (values are checked by RichTextAttributeSanitizer), anchors and video embeds.
                allow_elements:
                    iframe: ['src', 'title', 'allowfullscreen', 'loading', 'class']
                allow_attributes:
                    style: ['span', 'p', 'h1', 'h2', 'h3', 'h4', 'li', 'td', 'th']
                    id: ['h1', 'h2', 'h3', 'h4', 'p']
                    class: ['iframe', 'span']
                    data-icon: ['span']
                with_attribute_sanitizers:
                    - 'Commerce\Core\Text\RichTextAttributeSanitizer'
            # The shop owner's own HTML e-mails: https links and images only, layout tables and a fixed set of inline CSS.
            commerce.email_html:
                allow_safe_elements: true
                allow_relative_links: false
                allow_relative_medias: false
                force_https_urls: true
                allowed_link_schemes: ['https', 'mailto', 'tel']
                allowed_media_schemes: ['https']
                max_input_length: 200000
                allow_attributes:
                    style: ['*']
                    width: ['table', 'td', 'th', 'img']
                    height: ['td', 'th', 'img']
                    align: ['table', 'td', 'th', 'p', 'div', 'img', 'h1', 'h2', 'h3']
                    valign: ['td', 'th', 'tr']
                    bgcolor: ['table', 'td', 'th', 'tr']
                    cellpadding: ['table']
                    cellspacing: ['table']
                    border: ['table', 'img']
                    colspan: ['td', 'th']
                    rowspan: ['td', 'th']
                    role: ['table']
                with_attribute_sanitizers:
                    - 'Commerce\Core\Text\EmailHtmlAttributeSanitizer'
