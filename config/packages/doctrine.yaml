doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        options:
            # Per-connection guarantees that do not depend on the hosting defaults (shared hosts often ship MyISAM
            # and an empty sql_mode): UTC, strict mode (no silent truncation) and InnoDB for any table without an engine.
            1002: "SET time_zone = '+00:00', sql_mode = 'STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION', default_storage_engine = 'InnoDB'"
        profiling_collect_backtrace: '%kernel.debug%'
        mapping_types:
            enum: string
